<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <div class="form-container">
        <h2>Formulir Pendaftaran</h2>
        <form action="#" method="POST">
            
            <!-- 1. Text Input -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <!-- 2. Password Input -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            <!-- 3. Textarea -->
            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan Alamat"></textarea>
            </div>

            <!-- 4. Radio Button -->
            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <div class="radio-group">
                    <input type="radio" id="pria" name="gender" value="Pria">
                    <label for="pria">Pria</label>
                    <input type="radio" id="wanita" name="gender" value="Wanita">
                    <label for="wanita">Wanita</label>
                </div>
            </div>

            <!-- 5. Checkbox -->
            <div class="form-group">
                <label>Hobi:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="hobi1" name="hobi" value="Membaca">
                    <label for="hobi1">Membaca</label>
                    <input type="checkbox" id="hobi2" name="hobi" value="Olahraga">
                    <label for="hobi2">Olahraga</label>
                    <input type="checkbox" id="hobi3" name="hobi" value="Bermain Game">
                    <label for="hobi3">Bermain Game</label>
                </div>
            </div>

            <!-- 6. Select Option -->
            <div class="form-group">
                <label for="jurusan">Pilih Jurusan:</label>
                <select id="jurusan" name="jurusan">
                    <option value="">-- Pilih Salah Satu --</option>
                    <option value="Ilmu Komputer">Ilmu Komputer</option>
                    <option value="Teknologi Informasi">Teknologi Informasi</option>
                    <option value="Sains Data dan Kecerdasan Buatan">Sains Data dan Kecerdasan Buatan</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                </select>
            </div>

            <!-- 7. Submit Button -->
            <div class="form-group">
                <input type="submit" value="Submit">
            </div>

        </form>
    </div>

</body>
</html>
